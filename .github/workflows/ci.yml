name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billing_user
          POSTGRES_PASSWORD: billing_pass
          POSTGRES_DB: restaurant_billing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing_user -d restaurant_billing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://billing_user:billing_pass@localhost:5432/restaurant_billing
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
